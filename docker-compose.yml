services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ascend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ascend}
      POSTGRES_DB: ascend
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascend"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending Prisma migrations, then exits. `app` waits for
  # this to succeed before starting - no more SSH-ing in to run migrations
  # by hand on a fresh pull.
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://ascend:${POSTGRES_PASSWORD:-ascend}@db:5432/ascend
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://ascend:${POSTGRES_PASSWORD:-ascend}@db:5432/ascend
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      # Impressum/Datenschutz content - see .env.example. Unset is fine, the
      # legal pages just say so instead of showing fake data.
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_PHONE: ${OPERATOR_PHONE:-}
      # Web Push - see .env.example. Unset is fine, the "push
      # notifications" toggle in Settings just stays disabled/hidden.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Prometheus /api/metrics - unset leaves the endpoint disabled (404).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Login/registration rate limits - see .env.example for the defaults.
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-}
      REGISTER_RATE_LIMIT_MAX: ${REGISTER_RATE_LIMIT_MAX:-}
      REGISTER_RATE_LIMIT_WINDOW_MS: ${REGISTER_RATE_LIMIT_WINDOW_MS:-}
      # Set to "true" to close signups to everyone except people with an
      # invite link (see README).
      INVITE_ONLY: ${INVITE_ONLY:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  db-data:
  uploads-data:
