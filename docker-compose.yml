services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ascend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ascend}
      POSTGRES_DB: ascend
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascend"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ascend:${POSTGRES_PASSWORD:-ascend}@db:5432/ascend
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      # Impressum/Datenschutz content - see .env.example. Unset is fine, the
      # legal pages just say so instead of showing fake data.
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_PHONE: ${OPERATOR_PHONE:-}
      # Web Push - see .env.example. Unset is fine, the "push
      # notifications" toggle in Settings just stays disabled/hidden.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/uploads

volumes:
  db-data:
  uploads-data:
