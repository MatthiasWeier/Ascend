services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ascend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ascend}
      POSTGRES_DB: ascend
    # A install this size never needs Postgres's defaults (128MB buffers,
    # 100 connections) - the app's pool tops out around 10. Capped low on
    # purpose; raise shared_buffers if you outgrow it.
    command: postgres -c shared_buffers=64MB -c max_connections=30
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascend"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Hard ceiling so a runaway query can't eat the host's RAM - normal
    # usage here sits well under 50MB. Raise it if you see OOM kills
    # (`docker inspect ascend-db-1 | grep OOMKilled`) rather than data loss.
    deploy:
      resources:
        limits:
          memory: 256M

  # One-shot: applies pending Prisma migrations, then exits. `app` waits for
  # this to succeed before starting - no more SSH-ing in to run migrations
  # by hand on a fresh pull.
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://ascend:${POSTGRES_PASSWORD:-ascend}@db:5432/ascend
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://ascend:${POSTGRES_PASSWORD:-ascend}@db:5432/ascend
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      # Safety cap on Node's heap, not a target - the app runs around
      # 150-200MB RSS in practice. Without this, V8 sizes its heap off the
      # *host's* total memory, which can look alarming in `docker stats` and
      # (during a big spike) drag a small host into swap.
      NODE_OPTIONS: "--max-old-space-size=384"
      # Impressum/Datenschutz content - see .env.example. Unset is fine, the
      # legal pages just say so instead of showing fake data.
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_PHONE: ${OPERATOR_PHONE:-}
      # Web Push - see .env.example. Unset is fine, the "push
      # notifications" toggle in Settings just stays disabled/hidden.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Prometheus /api/metrics - unset leaves the endpoint disabled (404).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Rate limits (login lockout, registration) - only take effect once
      # the admin turns "Rate Limits" on in Admin > Instanz-Einstellungen.
      # Defaults shown in .env.example - only set these if you want
      # different numbers.
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-}
      REGISTER_RATE_LIMIT_MAX: ${REGISTER_RATE_LIMIT_MAX:-}
      REGISTER_RATE_LIMIT_WINDOW_MS: ${REGISTER_RATE_LIMIT_WINDOW_MS:-}
      # S3/MinIO storage backend - unset uses local disk (uploads-data
      # volume below). See .env.example.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Same idea as the db's limit: normal usage is ~150-200MB, this just
    # stops a leak or a burst of uploads from taking down the whole host.
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  db-data:
  uploads-data:
